name: Render 28-second fast pilot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    name: Generate AI art and render one pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-fast-pilot-pip-${{ hashFiles('requirements.txt') }}
      - uses: actions/cache@v4
        with:
          path: assets/ai_cache
          key: ${{ runner.os }}-pilot-flux-art-${{ hashFiles('src/ai_asset_generator.py') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-pilot-model-cache-v1
      - name: Install Python tools and packaged FFmpeg
        run: |
          python -m pip install -r requirements.txt
          mkdir -p "$RUNNER_TEMP/pilot-bin"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/pilot-bin/ffmpeg"
          echo "$RUNNER_TEMP/pilot-bin" >> "$GITHUB_PATH"
      - name: Test pilot code
        run: python -m unittest tests.test_fast_pilot tests.test_subtitle_engine -v
      - name: Generate art, voice and render only the pilot
        run: python src/pilot_compositor.py --workers 2
      - name: Upload the pilot and contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: ep01-fast-pilot
          path: |
            output/pilot/short_01_pilot_9x16.mp4
            output/pilot/pilot_contact_sheet.png
          if-no-files-found: error
          retention-days: 30
