name: Render Episode 01
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'tests/**', 'requirements.txt', '.github/workflows/render.yml']
permissions:
  contents: read
jobs:
  render:
    name: Render ${{ matrix.video }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        video:
          - full_youtube_video_16x9
          - short_01_ac_vs_dc_war_9x16
          - short_02_wireless_transformer_9x16
          - short_03_diamond_diode_trick_9x16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pillow-whisper-${{ hashFiles('requirements.txt') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-faster-whisper-base-en-v1
      - name: Install dependencies
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install -r requirements.txt
      - name: Test canvas and captions
        run: python -m unittest tests.test_canvas_engine tests.test_subtitle_engine tests.test_studio -v
      - name: Render and caption
        run: python src/studio_canvas_engine.py --video '${{ matrix.video }}' --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-${{ matrix.video }}
          path: output/ep01_phone_charger/
          if-no-files-found: error
          retention-days: 3
  audit:
    name: Verify and package
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pillow-whisper-${{ hashFiles('requirements.txt') }}
      - name: Install audit tools
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install 'numpy>=2,<3' 'Pillow>=11,<13'
      - uses: actions/download-artifact@v4
        with:
          pattern: rendered-*
          path: output/ep01_phone_charger
          merge-multiple: true
      - name: Check streams and make audit
        run: |
          python src/verify_canvas.py output/ep01_phone_charger
          python src/visual_audit.py
      - name: Upload episode and audit, including on audit failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-phone-charger-videos
          path: |
            README.md
            STATE.md
            output/ep01_phone_charger/
          if-no-files-found: error
          retention-days: 30
