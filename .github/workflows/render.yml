name: Render AI comic cutout pilot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    name: Render comic cutout pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Initialize diagnostic log
        run: |
          mkdir -p output/pilot
          rm -f output/pilot/short_01_pilot_9x16.mp4 output/pilot/pilot_contact_sheet.png output/pilot/render_metadata.json output/pilot/pilot_captions.ass
          printf 'Comic cutout pilot run %s, revision %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > output/pilot/build.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
            ~/.u2net
          key: ${{ runner.os }}-comic-v1-${{ hashFiles('requirements.txt') }}
      - name: Install rendering and audio tools
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt 2>&1 | tee -a output/pilot/build.log
          mkdir -p "$RUNNER_TEMP/pilot-bin"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/pilot-bin/ffmpeg"
          echo "$RUNNER_TEMP/pilot-bin" >> "$GITHUB_PATH"
      - name: Test and render comic pilot
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_comic_cutout tests.test_subtitle_engine -v 2>&1 | tee -a output/pilot/build.log
          timeout 960s python -u src/pilot_short.py 2>&1 | tee -a output/pilot/build.log
      - name: Upload pilot and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comic-cutout-pilot
          path: output/pilot/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit diagnostics to the current branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -eu
          mkdir -p output/pilot
          test -f output/pilot/build.log || echo 'Runner failed before log initialization.' > output/pilot/build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- output/pilot || true
          git add -f output/pilot/build.log
          for file in output/pilot/pilot_contact_sheet.png output/pilot/render_metadata.json output/pilot/pilot_captions.ass; do
            if test -f "$file"; then git add -f "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin "$BRANCH"
          if test "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA"; then
            echo 'Branch advanced during this run; diagnostics remain in the artifact.'
            exit 0
          fi
          git commit -m "Record comic pilot diagnostics for run $GITHUB_RUN_ID"
          git push origin "HEAD:$BRANCH"
