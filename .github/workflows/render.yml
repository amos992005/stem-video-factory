name: Render test video

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/render.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Render test scene
        run: |
          manim -ql src/test_pipeline.py TestScene
          mkdir -p output
          cp media/videos/test_pipeline/480p15/TestScene.mp4 output/test_video.mp4
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 output/test_video.mp4 | grep -qx audio
      - uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: output/test_video.mp4
          if-no-files-found: error
          retention-days: 30
