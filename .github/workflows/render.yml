name: Render AI-illustrated studio pilot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    name: Generate ten AI shots and edit one pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Initialize diagnostic log
        run: |
          mkdir -p output/pilot
          rm -f output/pilot/short_01_pilot_9x16.mp4 output/pilot/pilot_contact_sheet.png output/pilot/render_metadata.json output/pilot/pilot_captions.ass
          printf 'Pilot run %s, revision %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > output/pilot/build.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-studio-pilot-pip-${{ hashFiles('requirements.txt') }}
      - name: Install tools
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt 'huggingface_hub>=0.28.0' gradio_client 2>&1 | tee -a output/pilot/build.log
          mkdir -p "$RUNNER_TEMP/pilot-bin"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/pilot-bin/ffmpeg"
          echo "$RUNNER_TEMP/pilot-bin" >> "$GITHUB_PATH"
      - name: Test and render studio pilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          python -m unittest tests.test_fast_pilot tests.test_subtitle_engine -v 2>&1 | tee -a output/pilot/build.log
          timeout 720s python -u src/studio_editor.py 2>&1 | tee -a output/pilot/build.log
      - name: Upload pilot and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep01-fast-pilot
          path: |
            output/pilot/
            assets/pilot_shots/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit diagnostic log and valid AI shots to this branch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -eu
          mkdir -p output/pilot
          test -f output/pilot/build.log || echo 'Runner failed before log initialization.' > output/pilot/build.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- output/pilot || true
          git add -f output/pilot/build.log
          for file in output/pilot/pilot_contact_sheet.png output/pilot/render_metadata.json output/pilot/pilot_captions.ass; do
            if test -f "$file"; then git add -f "$file"; fi
          done
          # Partial successes are useful too. Only decoded, correctly sized JPEGs
          # are committed; failures remain visible in the log and artifacts.
          for file in assets/pilot_shots/shot_{01..10}.jpg; do
            if test -f "$file" && python -c 'import sys; sys.path.insert(0,"src"); from ai_asset_generator import valid_shot; sys.exit(0 if valid_shot(sys.argv[1]) else 1)' "$file"; then
              git add -f "$file"
            fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin "$BRANCH"
          if test "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA"; then
            echo 'Branch advanced during this run; refusing to overwrite it. Diagnostics remain in the artifact.'
            exit 0
          fi
          git commit -m "Record pilot diagnostics and AI cache for run $GITHUB_RUN_ID"
          git push origin "HEAD:$BRANCH"
