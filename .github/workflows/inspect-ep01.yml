name: Inspect Episode 01 artifact
on:
  push:
    paths: ['.github/workflows/inspect-ep01.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        file:
          - full_youtube_video_16x9
          - short_01_ac_vs_dc_war_9x16
          - short_02_wireless_transformer_9x16
          - short_03_diamond_diode_trick_9x16
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ep01-phone-charger-videos
          run-id: 45679504062
          github-token: ${{ github.token }}
          path: video
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Report metadata and frames
        env:
          VIDEO: ${{ matrix.file }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, subprocess
          name=os.environ['VIDEO']; p=pathlib.Path('video')/(name+'.mp4')
          data=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)]))
          v=next(s for s in data['streams'] if s['codec_type']=='video'); a=next(s for s in data['streams'] if s['codec_type']=='audio')
          duration=float(data['format']['duration'])
          print(f'::notice title=Video metadata::{name} {v["width"]}x{v["height"]} {duration:.2f}s {v["codec_name"]}/{a["codecname"] if "codecname" in a else a["codec_name"]}',flush=True)
          for i,fraction in enumerate((.22,.55,.82)):
              dest=f'/tmp/p{i}.jpg'
              size='scale=300:-2' if v['width'] > v['height'] else 'scale=200:-2'
              subprocess.run(['ffmpeg','-v','error','-ss',str(duration*fraction),'-i',str(p),'-frames:v','1','-vf',size,'-q:v','20','-y',dest],check=True)
              text=base64.b64encode(pathlib.Path(dest).read_bytes()).decode()
              print(f'::notice title=Preview {name} {i}::{text}',flush=True)
          PY
