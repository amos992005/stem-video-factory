name: Temporary render diagnostics
on:
  push:
    paths: ['.github/workflows/diagnose.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Tail failed scene log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/139521672819/logs > /tmp/job.log 2>/tmp/fetch.err || { echo "::error title=Log fetch::$(cat /tmp/fetch.err)"; exit 1; }
          python - <<'PY'
          import re
          raw=open('/tmp/job.log',errors='replace').read()
          lines=[x for x in raw.splitlines() if re.search(r'(error|exception|no space|invalid|failed|memory)',x,re.I)]
          s='\n'.join(lines)[-3000:]
          print('::error title=Diagnostic::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
