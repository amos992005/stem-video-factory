name: Temporary render diagnostics
on:
  push:
    paths: ['.github/workflows/diagnose.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Tail failed scene log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/139527081449/logs > /tmp/job.log 2>/tmp/fetch.err || { echo "::error title=Log fetch::$(cat /tmp/fetch.err)"; exit 1; }
          python - <<'PY'
          import re
          raw=open('/tmp/job.log',errors='replace').read()
          lines=raw.splitlines(); indexes=[i for i,x in enumerate(lines) if 'ep01_long_video' in x or 'zip() argument' in x]; s='\n'.join('\n'.join(lines[max(0,i-2):i+8]) for i in indexes)[-3000:]
          print('::error title=Diagnostic::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
