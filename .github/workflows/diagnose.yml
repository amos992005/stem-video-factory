name: Temporary render diagnostics
on:
  push:
    paths: ['.github/workflows/diagnose.yml']
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ep01-phone-charger-videos
          run-id: 45708962277
          github-token: ${{ github.token }}
          path: deliver
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify report, captions and media
        run: |
          python - <<'PY'
          import pathlib,json,subprocess
          p=pathlib.Path('deliver/output/ep01_phone_charger'); assert p.is_dir()
          videos=list(sorted(p.glob('*.mp4'))); assert len(videos)==4
          assert len(list(p.glob('*.ass')))==4 and len(list(p.glob('*.srt')))==4
          report=(p/'motion_audit_report.md').read_text(); assert 'FAIL' not in report
          print('::notice title=Visual audit::'+report.replace('%','%25').replace('\n','%0A'))
          for f in videos:
              data=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration:stream=codec_type,width,height','-of','json',str(f)]))
              v=next(s for s in data['streams'] if s['codec_type']=='video');assert any(s['codec_type']=='audio' for s in data['streams'])
              ass=(p/(f.stem+'.ass')).read_text(); lines=[line for line in ass.splitlines() if line.startswith('Dialogue:')]
              assert lines and all(line.count(r'{\1c&H20D7FF&}')==1 for line in lines)
              print(f'::notice title=Video::{f.name} {v["width"]}x{v["height"]} {float(data["format"]["duration"]):.2f}s; {len(lines)} word highlights')
          PY
      - name: Preview landscape contact sheet
        run: |
          python - <<'PY'
          import pathlib,base64,subprocess
          source='deliver/output/ep01_phone_charger/visual_contact_sheet_16x9.png';dest='/tmp/sheet.jpg'
          subprocess.run(['ffmpeg','-v','error','-i',source,'-vf','scale=600:-2','-frames:v','1','-q:v','25','-y',dest],check=True)
          data=base64.b64encode(pathlib.Path(dest).read_bytes()).decode()
          for n in range((len(data)+2999)//3000): print(f'::notice title=SHEET {n}::{data[n*3000:(n+1)*3000]}')
          PY
      - name: Preview subtitle frames
        run: |
          python - <<'PY'
          import pathlib,base64,subprocess,re
          root=pathlib.Path('deliver/output/ep01_phone_charger')
          for i,name in enumerate(['full_youtube_video_16x9','short_01_ac_vs_dc_war_9x16']):
              lines=(root/(name+'.srt')).read_text().splitlines()
              entries=[]
              for j,line in enumerate(lines):
                  if ' --> ' in line:
                      def sec(t):
                          h,m,s=t.replace(',','.').split(':');return int(h)*3600+int(m)*60+float(s)
                      a,b=map(sec,line.split(' --> '));entries.append((a,b,lines[j+1]))
              cue=min(entries,key=lambda x:abs(x[0]-(45 if i==0 else 15)))
              t=(cue[0]+cue[1])/2; print(f'::notice title=Caption sample::{name} at {t:.2f}s: {cue[2]}')
              dest=f'/tmp/frame{i}.jpg';size='scale=640:-2' if i==0 else 'scale=320:-2'
              subprocess.run(['ffmpeg','-v','error','-ss',str(t),'-i',str(root/(name+'.mp4')),'-frames:v','1','-vf',size,'-q:v','20','-y',dest],check=True)
              data=base64.b64encode(pathlib.Path(dest).read_bytes()).decode()
              for n in range((len(data)+2999)//3000): print(f'::notice title=CAP {i} {n}::{data[n*3000:(n+1)*3000]}')
          PY
