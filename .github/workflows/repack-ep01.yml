name: Package final Episode 01 artifact
on:
  push:
    paths: ['.github/workflows/repack-ep01.yml']
permissions:
  contents: read
  actions: read
jobs:
  repack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ep01-phone-charger-videos
          run-id: 45679504062
          github-token: ${{ github.token }}
          path: output/ep01_phone_charger
      - name: Check package
        run: |
          set -euo pipefail
          test "$(find output/ep01_phone_charger -maxdepth 1 -name '*.mp4' | wc -l)" -eq 4
          test "$(find output/ep01_phone_charger -maxdepth 1 -name '*.srt' | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: ep01-phone-charger-videos
          path: |
            README.md
            output/ep01_phone_charger/
          if-no-files-found: error
          retention-days: 30
